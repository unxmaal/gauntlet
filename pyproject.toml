[project]
name = "gauntlet"
version = "0.2.0"
description = "A corpus of logical failure classes, with the detectors, review heuristics and ratchets that hold a repo to it."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gauntlet = "gauntlet.cli:main"

[project.entry-points.pytest11]
gauntlet = "gauntlet.pytest_plugin"

[project.optional-dependencies]
hcl = [
    "python-hcl2>=8.2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gauntlet"]

[tool.hatch.build.targets.wheel.force-include]
"corpus" = "gauntlet/corpus"

[tool.pytest.ini_options]
testpaths = ["tests"]
