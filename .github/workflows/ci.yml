name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tests
        run: uv run pytest -q
      - name: Install the built wheel in a fresh venv
        run: |
          set -euo pipefail
          uv build --wheel -o dist
          uv venv fresh
          VIRTUAL_ENV=fresh uv pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/fresh/bin/gauntlet" corpus-dir | grep -q site-packages/gauntlet/corpus
          test "$("$GITHUB_WORKSPACE/fresh/bin/gauntlet" classes | wc -l)" -ge 40
